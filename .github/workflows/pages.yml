name: Build and deploy design atlas
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: github-pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm run build
      - run: npm run check
      - uses: actions/configure-pages@v5
        if: vars.PUBLISH_SITE == 'true'
      - uses: actions/upload-pages-artifact@v3
        if: vars.PUBLISH_SITE == 'true'
        with:
          path: dist
  deploy:
    if: vars.PUBLISH_SITE == 'true'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
