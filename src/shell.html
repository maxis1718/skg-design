<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="light"><title>SKG 空間規劃</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 40 40'%3E%3Crect width='40' height='40' rx='6' fill='%23253c36'/%3E%3Ctext x='20' y='28' font-family='serif' font-size='27' text-anchor='middle' fill='%23eaf0e4'%3ES%3C/text%3E%3C/svg%3E">
<style>/*__STYLE__*/</style>
</head>
<body>
<header class="masthead">
  <a class="brand" href="#floor"><span class="brand-mark">SKG</span></a>
  <div class="edition"><button type="button" class="brief-btn" id="brief-btn" aria-expanded="false" aria-controls="brief-panel" aria-label="溝通重點" title="溝通重點">💡</button><nav class="lang-switch" aria-label="Language / 語言"><a href="?lang=zh" data-lang="zh" lang="zh-Hant">中文</a><a href="?lang=en" data-lang="en" lang="en">EN</a></nav><b>R31</b></div>
</header>
<div class="brief-panel" id="brief-panel" hidden><div class="brief-inner"><div class="brief-head"><h2>關鍵改動與溝通重點</h2><button type="button" class="tool" id="brief-close" aria-label="關閉">×</button></div><ol id="brief-list"></ol></div></div>
<main>
  <nav class="tabs" role="tablist" aria-label="選擇空間" id="tabs"></nav>
  <section class="workspace" id="main-panel" role="tabpanel" aria-labelledby="tab-floor">
    <div class="drawing-card">
      <div class="drawing-head"><h2 id="drawing-title">全屋</h2><div class="version-toolbar" id="version-toolbar"><span class="version-group" id="layout-version-group"><span class="version-label">全屋格局</span><div class="seg" id="layout-version" role="group" aria-label="切換格局"></div></span><span class="version-group" id="kitchen-version-group"><div class="seg" id="kitchen-version" role="group" aria-label="切換廚房方案"></div></span><span class="version-group" id="guest-version-group"><div class="seg" id="guest-version" role="group" aria-label="切換客房方案"></div></span><span class="version-group" id="master-version-group" hidden><div class="seg" id="master-version" role="group" aria-label="切換主臥方案"></div></span><span class="version-group" id="living-version-group" hidden><div class="seg" id="living-version" role="group" aria-label="切換電視櫃方案"></div></span></div><div class="toolbar"><button class="tool active icon-tool" id="toggle-dims" aria-pressed="true" title="尺寸" aria-label="尺寸">📐</button><button class="tool active icon-tool" id="toggle-objects" aria-pressed="true" title="物件" aria-label="物件">🪑</button><button class="tool power-tool" id="toggle-power" aria-pressed="false" title="電與網路" aria-label="電與網路">⚡</button></div></div>
      <div class="plan-stage" id="plan-stage"><svg id="plan" viewBox="137 101 484 330" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="新格局互動平面圖，房間與家具可點選"><desc>房間內牆與家具來源於 Floor plan scale PDF。選擇房間或家具以查看公分尺寸。</desc><defs><pattern id="paper-grid" width="14.1732" height="14.1732" patternUnits="userSpaceOnUse"><path d="M14.1732 0H0V14.1732" fill="none" stroke="#d7d8d0" stroke-width=".15" opacity=".45"/></pattern><radialGradient id="ap-glow"><stop offset="0" stop-color="#2f68a6" stop-opacity=".16"/><stop offset="1" stop-color="#2f68a6" stop-opacity="0"/></radialGradient></defs><rect x="100" y="70" width="600" height="450" fill="url(#paper-grid)"/><g id="room-zones"></g><g id="source-geometry">/*__PLAN__*/</g><g id="furniture-geometry">/*__FURNITURE__*/</g><g id="object-fills"></g><g id="dimension-layer"></g><g id="room-labels"></g><g id="object-hits"></g><g id="selected-dimensions"></g><g id="power-layer" style="display:none"></g><g id="scale-bar" transform="translate(469 414)"><path d="M0 0V2H56.693V0M28.3465 0V2" fill="none" stroke="currentColor" stroke-width=".5"/><text x="0" y="7">0</text><text x="28.3465" y="7" text-anchor="middle">100</text><text x="56.693" y="7" text-anchor="end">200 cm</text></g></svg></div>
      <div class="drawing-foot"><div class="legend power-legend" id="power-legend" hidden></div></div>
      <div class="smart-block" id="smart-block" hidden></div><div class="todo-block" id="todo-block" hidden><h3 class="todo-head">待辦 <span class="todo-count" id="todo-count"></span></h3><ul class="todo-list" id="todo-list"></ul></div>
    </div>
  </section>
  <section class="smart-record" id="smart-record" aria-label="電與智能家居" hidden></section>
  <section class="details-section" id="details-section"><div class="section-heading"><h2 id="details-title">空間索引</h2></div><div id="elevation-slot"></div><div class="details-layout"><div id="details-content"></div><aside class="inspector" aria-live="polite" id="inspector"></aside></div></section>
  <section class="inventory-section"><div class="section-heading"><h2 id="inventory-title">大型物件尺寸簿</h2><div class="inventory-actions"><label class="search-box"><span>搜尋</span><input id="object-search" placeholder="冰箱、衣櫃、KIT-01…" aria-label="搜尋物件"></label></div></div><div class="table-wrap"><table><thead><tr><th>索引 / 物件</th><th>空間</th><th>圖面 W × D <small>cm</small></th><th>尺寸依據</th><th>實物 W × D × H <small>cm</small></th><th>品牌 / 型號</th></tr></thead><tbody id="inventory-body"></tbody></table><p id="no-results" hidden>沒有符合的物件。</p></div></section>
  <section class="reference-section"><details id="reference-details"><summary><span>量測依據與版本紀錄</span><span class="summary-plus">＋</span></summary><div class="reference-body"><div id="measurement-policy"></div><div id="change-list"></div><button class="plain-button" id="show-source">查看兩份原圖 ↗</button></div><details class="auxiliary"><summary>附屬空間尺寸 · 陽台、衛浴與冷氣平台</summary><div id="auxiliary-list"></div></details></details></section>
</main>
<dialog id="source-dialog"><div class="modal-head"><h2>圖面來源</h2><button class="tool" id="close-source">關閉 ✕</button></div><div class="source-switch"><button class="tool active" data-source="new">新格局 · Floor plan scale</button><button class="tool" data-source="original">原始格局 · Summary 第 4 頁</button></div><p id="source-caption">原圖保留原始標註（mm）；互動圖冊已統一換算 cm。</p><img id="source-image" alt="原始圖面" src="/*__SOURCE_NEW__*/"></dialog>
<dialog id="research-dialog" class="research-dialog" aria-labelledby="research-title"><div class="research-inner"><div class="research-head"><h2 id="research-title"></h2><button type="button" class="research-close" id="close-research" aria-label="關閉">✕</button></div><div class="research-body" id="research-content"></div></div></dialog>
<div class="tooltip" id="tooltip" role="tooltip" hidden></div>
<script id="project-data" type="application/json">/*__DATA__*/</script>
<script id="i18n-data" type="application/json">/*__I18N__*/</script>
<script>/*__ELEVATION__*/</script>
<script>/*__APP__*/</script>
</body></html>
